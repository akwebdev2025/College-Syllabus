name: Update PU Syllabus Data

on:
  schedule:
    - cron: "17 2 * * 1" # Every Monday at 02:17 UTC; edit this cron to change schedule.
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "data/sources.json"
      - ".github/workflows/update-syllabus.yml"

permissions:
  contents: write

concurrency:
  group: update-pu-syllabus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 pypdf

      - name: Discover and download official PU documents
        run: python scripts/update_sources.py

      - name: Extract only confidently structured records
        run: python scripts/extract_syllabus.py

      - name: Validate published data
        run: python scripts/validate_data.py

      - name: Commit only when validated files changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-manifest.json data/discovery-report.json data/source-pdfs data/syllabus data/update-history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update validated PU syllabus data"
          git push
